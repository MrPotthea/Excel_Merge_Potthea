<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google-site-verification" content="OITqdNGovfxWoepDsnvVjKrhinyPB7Bt5Q5cNeQ1kIg" />
<link rel="icon" href="ycp_logo.ico">
<title>Excel Merge Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2430;--muted:#667085;--line:#d9dee7;--accent:#1f6feb;--accent-t:#fff;--ok:#157f3b;--err:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d222a;--text:#e8ecf2;--muted:#9aa5b5;--line:#313845;--accent:#4c8dff;--accent-t:#fff;--ok:#4cc27a;--err:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d222a;--text:#e8ecf2;--muted:#9aa5b5;--line:#313845;--accent:#4c8dff;--accent-t:#fff;--ok:#4cc27a;--err:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Khmer",sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.drop b{color:var(--text);display:block;font-size:16px;margin-bottom:4px}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--accent-t);cursor:pointer;font-weight:bold}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:normal}
button:disabled{opacity:.45;cursor:not-allowed}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tfoot td{font-weight:bold;border-bottom:0}
label{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.msg{font-size:14px;margin-top:10px}
.ok{color:var(--ok)}.err{color:var(--err)}
.x{background:none;border:0;color:var(--muted);padding:0 6px;font-size:16px}
</style>
</head>
<body>
<main>
  <h1>Excel Merge Tool · ឧបករណ៍បញ្ចូលឯកសារ Excel</h1>
  <p class="sub">Combine many .xls / .xlsx files into one sheet. Files are read in your browser and never uploaded. · បញ្ចូលឯកសារច្រើនទៅជាឯកសារតែមួយ។</p>

  <div class="card">
    <div class="drop" id="drop">
      <b>Click or drop files here · ចុច ឬអូសឯកសារមកទីនេះ</b>
      .xls, .xlsx, .csv — select several at once
    </div>
    <input type="file" id="file" multiple accept=".xls,.xlsx,.xlsm,.csv" hidden>
  </div>

  <div class="card" id="listCard" hidden>
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>File</th><th class="n">Rows</th><th class="n">Cols</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td></td><td>Total</td><td class="n" id="total">0</td><td></td><td></td></tr></tfoot>
      </table>
    </div>
  </div>

  <div class="card" id="optCard" hidden>
    <label><input type="checkbox" id="optSource" checked> Add a “Source file” column at the end</label>
    <label><input type="checkbox" id="optHeader"> First row of each file is a header (keep it once, drop it from the other files)</label>
    <label><input type="checkbox" id="optSort" checked> Sort files by name before merging</label>
    <label><input type="checkbox" id="optRenum"> Renumber column A as 1, 2, 3… across the merged file</label>
    <label><input type="checkbox" id="optDedupe" checked> Also create a sheet with duplicates removed, based on column <input type="text" id="dedupeCol" value="FC" maxlength="3" style="width:56px;text-transform:uppercase;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)"> (keeps the first row of each value)</label>
    <div class="row">
      <button id="merge">Merge &amp; download .xlsx</button>
      <button class="sec" id="clear">Clear</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script>
(function(){
  var files=[]; // {name, aoa}
  var $=function(id){return document.getElementById(id)};
  var drop=$('drop'), input=$('file');

  // Download capability (works inside the hosted page). null = not available.
  var downloads=null;
  try{
    if(window.claude&&claude.use){
      claude.use('downloads').then(function(d){downloads=d||null}).catch(function(){downloads=null});
    }
  }catch(e){downloads=null}

  drop.addEventListener('click',function(){input.click()});
  input.addEventListener('change',function(){addFiles(input.files);input.value=''});
  ['dragover','dragenter'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(ev){addFiles(ev.dataTransfer.files)});

  function say(t,c){var m=$('msg');m.textContent=t;m.className='msg '+(c||'')}

  function readOne(f){
    return new Promise(function(res){
      var r=new FileReader();
      r.onload=function(){
        try{
          var wb=XLSX.read(r.result,{type:'array',raw:true,cellDates:false});
          var aoa=[];
          wb.SheetNames.forEach(function(n){
            var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false});
            rows.forEach(function(x){aoa.push(x)});
          });
          res({name:f.name,aoa:aoa});
        }catch(e){res({name:f.name,error:String(e)})}
      };
      r.onerror=function(){res({name:f.name,error:'Could not read file'})};
      r.readAsArrayBuffer(f);
    });
  }

  function addFiles(list){
    var arr=Array.prototype.slice.call(list);
    Promise.all(arr.map(readOne)).then(function(out){
      var bad=[];
      out.forEach(function(o){
        if(o.error){bad.push(o.name)}
        else if(!files.some(function(x){return x.name===o.name})){files.push(o)}
      });
      render();
      if(bad.length)say('Could not read: '+bad.join(', '),'err');else say('');
    });
  }

  function render(){
    var tb=$('rows');tb.textContent='';
    var total=0;
    files.forEach(function(f,i){
      var cols=f.aoa.reduce(function(m,r){return Math.max(m,r.length)},0);
      total+=f.aoa.length;
      var tr=document.createElement('tr');
      [i+1,f.name,f.aoa.length,cols].forEach(function(v,k){
        var td=document.createElement('td');td.textContent=v;if(k>=2)td.className='n';tr.appendChild(td)});
      var td=document.createElement('td');var b=document.createElement('button');
      b.className='x';b.textContent='✕';b.title='Remove';
      b.onclick=function(){files.splice(i,1);render()};
      td.appendChild(b);tr.appendChild(td);tb.appendChild(tr);
    });
    $('total').textContent=total;
    $('listCard').hidden=$('optCard').hidden=!files.length;
  }

  $('clear').onclick=function(){files=[];render();say('')};

  // Save: use the hosted-page download capability; fall back to a normal
  // browser download when the page is opened as a plain file.
  function saveFile(buf, filename){
    if(downloads){
      return downloads.save({filename:filename,data:buf});
    }
    return new Promise(function(res,rej){
      try{
        var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');
        a.href=url;a.download=filename;
        document.body.appendChild(a);a.click();
        setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},100);
        res({status:'saved'});
      }catch(e){rej(e)}
    });
  }

  $('merge').onclick=function(){
    if(!files.length)return;
    var list=files.slice();
    if($('optSort').checked)list.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
    var hdr=$('optHeader').checked, src=$('optSource').checked, renum=$('optRenum').checked;
    var width=0;list.forEach(function(f){f.aoa.forEach(function(r){width=Math.max(width,r.length)})});
    var out=[];
    list.forEach(function(f,fi){
      f.aoa.forEach(function(r,ri){
        var isHead=hdr&&ri===0;
        if(isHead&&fi>0)return;
        var row=r.slice();while(row.length<width)row.push(null);
        if(renum&&!isHead)row[0]=out.length+(hdr?0:1);
        if(src)row.push(isHead?'Source file':f.name);
        out.push(row);
      });
    });
    var ws=XLSX.utils.aoa_to_sheet(out);
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Combined');
    var dedupMsg='';
    if($('optDedupe').checked){
      var letters=($('dedupeCol').value||'').trim().toUpperCase();
      if(!/^[A-Z]{1,3}$/.test(letters)){say('Enter a valid column letter, for example FC.','err');return}
      var ci=0;for(var k=0;k<letters.length;k++)ci=ci*26+(letters.charCodeAt(k)-64);ci--;
      var seen={},uniq=[];
      out.forEach(function(r,ri){
        if(hdr&&ri===0){uniq.push(r);return}
        var v=r[ci];var key=(v===null||v===undefined)?'\u0000empty':String(v);
        if(seen[key])return;seen[key]=1;uniq.push(r);
      });
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(uniq),('No Duplicate '+letters).slice(0,31));
      dedupMsg=' Unique rows by column '+letters+': '+(uniq.length-(hdr?1:0))+'.';
    }
    var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var dataRows=out.length-(hdr?1:0);
    var btn=$('merge');btn.disabled=true;
    saveFile(buf,'Combined-'+dataRows+'-rows.xlsx').then(function(){
      say('Done: '+dataRows+' rows merged from '+list.length+' files.'+dedupMsg,'ok');
    }).catch(function(e){
      if(e&&e.code==='declined')say('Download cancelled. Click again to save.','err');
      else say('Could not save: '+((e&&e.message)||'unknown error'),'err');
    }).then(function(){btn.disabled=false});
  };
})();
</script>
</body>
</html>
